[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-replay-multimodal-search"
version = "0.1.0"
description = "Semantic + precise search engine for League of Legends replay timelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.4.0",
  "python-dotenv>=1.0.0",
  "pandas>=2.2.0",
  "plotly>=5.22.0",
  "streamlit>=1.64.0",
]

[project.optional-dependencies]
llm = [
  "openai>=1.40.0",
]
embeddings = [
  "sentence-transformers>=2.7.0",
  "torch>=2.2.0",
]
video = [
  "opencv-python-headless>=4.10,<5",
]

[project.scripts]
lol-search = "lol_search.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
